name: Publish Dominion Generator

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/generator-pages.yml
      - SetGenerator/**
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - run: node SetGenerator/test_generator_solver.js
      - name: Prepare static HTML files
        run: |
          mkdir -p _site
          cp SetGenerator/Dominion-Generator.html _site/index.html
          cp SetGenerator/Dominion-Konverter.html _site/Dominion-Konverter.html
          cp -R SetGenerator/card-images _site/card-images
          cmp SetGenerator/Dominion-Generator.html _site/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
