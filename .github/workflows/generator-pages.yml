name: Publish Dominion Generator

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/generator-pages.yml
      - SetGenerator/**
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - run: node SetGenerator/test_generator_solver.js
      - run: python SetGenerator/test_generator_catalog.py
      - name: Prepare static HTML files
        run: |
          mkdir -p _site
          cp SetGenerator/Dominion-Generator.html _site/index.html
          cp SetGenerator/Dominion-Konverter.html _site/Dominion-Konverter.html
          cp -R SetGenerator/card-images _site/card-images
          cmp SetGenerator/Dominion-Generator.html _site/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: _site
      - name: Wait for uploaded Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..12}; do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              --jq "[.artifacts[] | select(.name == \"$PAGES_ARTIFACT_NAME\" and .expired == false)] | length")
            if [ "$count" = "1" ]; then
              exit 0
            fi
            if [ "$count" -gt "1" ]; then
              echo "::error::Multiple artifacts found for $PAGES_ARTIFACT_NAME."
              exit 1
            fi
            echo "Waiting for $PAGES_ARTIFACT_NAME ($attempt/12)..."
            if [ "$attempt" -lt "12" ]; then sleep 5; fi
          done
          echo "::error::Uploaded Pages artifact did not become available within 55 seconds."
          exit 1
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
